name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Website (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Il sito statico si costruisce sui file di public/dati/ (esportati
      # dall'ETL, non versionati): in CI bastano le fixture finte, con la
      # stessa forma e gli stessi percorsi.
      - run: npm run fixture
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  etl:
    name: Pipeline (unit + SQL tests on a throwaway PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: parimetro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/parimetro_test
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/parimetro_test
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            etl/requirements.txt
            etl/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python applica_migrazioni.py
      - run: python -m pytest -q

  # Il progetto Pages "parimetro" e' a caricamento diretto (non collegato a
  # GitHub): e' questa la struttura che pubblica il sito dopo i test. Skippa
  # (senza fallire) quando i segreti non sono ancora configurati.
  deploy:
    name: Deploy on Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [web, etl]
    if: ${{ github.ref == 'refs/heads/main' && needs.web.result == 'success' && needs.etl.result == 'success' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # La build di publish e' quella del job web: qui si ricostruisce (i
      # artifact fra job non passano senza upload-artifact, e l'output pesa)
      - run: npm ci
        working-directory: web
      - run: npm run fixture && npm run build
        working-directory: web
      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler pages deploy out --project-name parimetro --branch main
        working-directory: web
      - name: Configura i segreti (una volta sola)
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::notice::Deploy saltato: manca CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID nei segreti del repo. Istruzioni in parimetro/web/README o DEPLOY.md"
