name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Website (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  etl:
    name: Pipeline (unit + SQL tests on a throwaway PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: parimetro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/parimetro_test
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/parimetro_test
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            etl/requirements.txt
            etl/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python applica_migrazioni.py
      - run: python -m pytest -q
