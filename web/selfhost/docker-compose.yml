# ============================================================
# mappa-bilanci · officina dati
#
# Un servizio solo: Postgres + PostGIS. Non e' il sito — il sito e' statico
# su Cloudflare Pages. Qui ci girano l'ETL e l'export dei JSON, poi la
# macchina puo' anche spegnersi: online non cambia nulla.
#
# Postgres e' pubblicato solo su 127.0.0.1: ci arriva l'ETL dalla stessa
# macchina, mai internet.
# ============================================================
name: mappabilanci

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: mappabilanci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?serve POSTGRES_PASSWORD nel file .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    command:
      # Tarature per un portatile con 16 GB. Con 8 GB dimezza i primi due.
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=48MB
      - -c
      - maintenance_work_mem=512MB
      # Su SSD una lettura casuale costa quasi come una sequenziale: il
      # default 4.0 e' tarato sui dischi meccanici.
      - -c
      - random_page_cost=1.1
      - -c
      - max_parallel_workers_per_gather=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mappabilanci"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
